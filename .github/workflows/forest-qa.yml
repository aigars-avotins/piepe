name: Forest QA
on:
  push:
    branches: [main, codex/living-forest-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:worker && npm run build
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forest-qa-and-scroll-recordings
          path: |
            dist/
            test-results/
            playwright-report/
          retention-days: 14
