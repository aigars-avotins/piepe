name: Forest QA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - '!public/**/*-original.*'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - 'playwright.config.*'
      - 'wrangler.*'
      - '.npmrc'
      - '.github/workflows/forest-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - '!public/**/*-original.*'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - 'playwright.config.*'
      - 'wrangler.*'
      - '.npmrc'
      - '.github/workflows/forest-qa.yml'
  workflow_dispatch:
    inputs:
      validation:
        description: 'Release: full suites; production: live smoke after a validated release; single browsers: diagnostics'
        type: choice
        options: [release, chromium, webkit, production]
        default: release
      production_smoke:
        description: 'Also verify the deployed release in both browsers (run after deployment)'
        type: boolean
        default: false
      diagnostic_grep:
        description: 'Optional single-browser diagnostic filter; ignored for release and production smoke'
        type: string
        default: ''
permissions:
  contents: read
# Automatic/diagnostic runs share a per-branch or PR group. Each release has its own group,
# so even a newer push or another manual release cannot cancel an approved validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.validation == 'release' || inputs.validation == 'production' || inputs.production_smoke) && format('release-{0}', github.run_id) || format('checks-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.validation != 'release' && inputs.validation != 'production' && !inputs.production_smoke) }}
jobs:
  checks:
    name: Lightweight checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Worker unit tests
        run: npm run test:worker
      - name: Production build
        run: npm run build
  chromium:
    if: github.event_name == 'workflow_dispatch' && (inputs.validation == 'release' || inputs.validation == 'chromium' || inputs.validation == 'production' || inputs.production_smoke)
    needs: checks
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: inputs.validation != 'production'
        run: |
          if [ -n "$PIEPE_DIAGNOSTIC_GREP" ]; then
            npm test -- --project=chrome-desktop --grep "$PIEPE_DIAGNOSTIC_GREP"
          else
            npm test -- --project=chrome-desktop
          fi
        env:
          CI: true
          PIEPE_DIAGNOSTIC_GREP: ${{ inputs.validation != 'release' && !inputs.production_smoke && inputs.diagnostic_grep || '' }}
      - if: inputs.production_smoke || inputs.validation == 'production'
        run: npm test -- tests/production.spec.ts --project=chrome-desktop
        env:
          CI: true
          PRODUCTION_SMOKE: true
          TEST_URL: https://pie.pe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: forest-qa-and-scroll-recordings
          path: |
            dist/
            test-results/
            production-results/
          retention-days: 14
  webkit:
    if: github.event_name == 'workflow_dispatch' && (inputs.validation == 'release' || inputs.validation == 'webkit' || inputs.validation == 'production' || inputs.production_smoke)
    needs: checks
    # Native macOS media codecs remain part of every release validation.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - if: inputs.validation != 'production'
        run: |
          if [ -n "$PIEPE_DIAGNOSTIC_GREP" ]; then
            npm test -- --project=webkit-iphone --grep "$PIEPE_DIAGNOSTIC_GREP"
          else
            npm test -- --project=webkit-iphone
          fi
        env:
          CI: true
          PIEPE_DIAGNOSTIC_GREP: ${{ inputs.validation != 'release' && !inputs.production_smoke && inputs.diagnostic_grep || '' }}
      - if: inputs.production_smoke || inputs.validation == 'production'
        run: npm test -- tests/production.spec.ts --project=webkit-iphone
        env:
          CI: true
          PRODUCTION_SMOKE: true
          TEST_URL: https://pie.pe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: forest-qa-webkit-macos
          path: |
            test-results/
            production-results/
          retention-days: 14
